version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/services/tasks-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/services/title-normalizer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  
  - package-ecosystem: "docker"
    directory: "/services/tasks-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3